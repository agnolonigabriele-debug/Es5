<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>divisori</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
        integrity="sha384-Bk5cbLkZQ5raZ0+H2/+VbfYx3WpvxvQK4zqXZr7sYODuaX7bKXoSOnipQxkaS8sv" crossorigin="anonymous">
</head>

<div class="row vh-100 flex-column justify-content-center bg-primary">
    <div class="container w-75 bg-body border border-2 border-black text-center p-4 mb-4">
        <h1 class="fw-bold">Number Guessing Game</h1>
        <h4><i class="bi bi-arrow-right-circle" id="infoBtn"></i> istruzioni</h4>
        <p class="d-none" id="infoTesto">numero tra 0 e 100 ed hai 7 tentativi</p>
        <button class="btn btn-primary" id="btnGioca">Gioca</button>
    </div>

    <div id="giocaContainer" class="d-none container w-75 bg-body border border-2 border-black text-center p-4">

        <div class="alert alert-danger d-none" id="errore">
            <p class="mb-0" id="erroreTesto">numero non valido inserito</p>
        </div>
        <div class="input-group">
            <input id="numero" placeholder="inserisci il umero" class="form-control" type="number">
            <button id="btnIndovina" class="btn btn-primary" type="submit">check</button>
        </div>
        <div class="row mt-3">
            <div class="col-md-4 p-2">
                <h3>Tentativi Rimasti</h3>
                <i class="bi bi-joystick fs-1"></i>
                <p id="tentativi">...</p>
            </div>
            <div class="col-md-4 p-2">
                <h3>suggerimenti</h3>
                <i class="bi bi-info-square fs-1"></i>
                <p id="info">...</p>
            </div>
            <div class="col-md-4 p-2">
                <h3>Numeri inseriti</h3>
                <i class="bi bi-pencil-square fs-1"></i>
                <p id="cronologia">...</p>
            </div>
        </div>
    </div>
</div>
</div>


<body>

    <script src="./js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
